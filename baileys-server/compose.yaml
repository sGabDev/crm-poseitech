services:
  baileys:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      WHATSAPP_SERVICE_HOST: 0.0.0.0
      WHATSAPP_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - sessions:/app/data
    stop_grace_period: 30s
volumes:
  sessions:
